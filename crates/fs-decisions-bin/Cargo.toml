[package]
name = "fs-decisions-bin"
description = "FreeSynergy Decisions: one command for the program. Without words it makes sure the server runs and opens the frontend; `serve` runs the server."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-decisions"
path = "src/main.rs"

[dependencies]
fs-decisions-server = { path = "../fs-decisions-server" }
fs-decisions-client = { path = "../fs-decisions-client" }

# The frontend `simple` is a package of its own (one deb/rpm per Cargo package, ADR 0094 draft): the program needs it.
# Both binaries are never in ONE deb (file conflict with the deb of fs-decisions-simple).
[package.metadata.deb]
name = "fs-decisions"
# cargo-deb replaces only `$auto` in `depends`; so a fixed lower bound, not `${binary:Version}`.
depends = "$auto, fs-decisions-simple (>= 0.0.1)"

# A package with its own generate-rpm table lists its assets itself (fs-release scripts/linux-pkg.sh).
[package.metadata.generate-rpm]
name = "fs-decisions"
assets = [{ source = "target/release/fs-decisions", dest = "/usr/bin/fs-decisions", mode = "755" }]
[package.metadata.generate-rpm.requires]
fs-decisions-simple = ">= 0.0.1"
