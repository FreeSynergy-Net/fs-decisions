[package]
name = "fs-decisions-client"
description = "Client of the decisions contract (surveys.capnp, draft 0.1): connects to fs-decisions over a local socket and checks the contract version"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", tag = "v0.0.2" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.27" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
fs-decisions-server = { path = "../fs-decisions-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
